<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    #status {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      cursor: pointer;
    }
    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    #job-list {
      list-style: none;
      margin: 8px 0 0 0;
      padding: 0;
      max-height: 260px;
      overflow-y: auto;
    }
    .job-item {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .job-title {
      font-size: 13px;
      font-weight: 600;
    }
    .job-title a {
      color: #0b57d0;
      text-decoration: none;
    }
    .job-meta {
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Job Vault</h1>
  <input id="search" type="search" placeholder="Filter jobs...">
  <ul id="job-list"></ul>
  <div id="status">Loading jobs...</div>
  <button id="save">Save Job</button>
  <script src="popup.js" type="module"></script>
</body>
</html>
