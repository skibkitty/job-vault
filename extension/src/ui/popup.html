<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    #status {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      cursor: pointer;
    }
    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    #job-list {
      list-style: none;
      margin: 8px 0 0 0;
      padding: 0;
      max-height: 260px;
      overflow-y: auto;
    }
    .job-item {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .job-item:hover {
      background-color: #f5f5f5;
    }
    .job-title {
      font-size: 13px;
      font-weight: 600;
    }
    .job-title a {
      color: #0b57d0;
      text-decoration: none;
    }
    .job-meta {
      font-size: 12px;
      color: #777;
    }
    #detail-view {
      display: none;
    }
    #back-btn {
      background: none;
      border: 1px solid #ccc;
      padding: 4px 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .detail-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }
    .detail-meta {
      font-size: 12px;
      color: #555;
      margin-bottom: 8px;
    }
    .detail-section {
      margin-top: 10px;
    }
    .detail-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 4px;
    }
    .detail-text {
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .detail-list {
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
      padding-left: 18px;
    }
    .detail-snapshot-info {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 6px;
    }
    .snapshot-list {
      list-style: none;
      margin: 6px 0 0 0;
      padding: 0;
    }
    .snapshot-item {
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 12px;
      color: #333;
    }
    .snapshot-item:hover {
      background-color: #f5f5f5;
    }
    .snapshot-item-date {
      font-weight: 600;
    }
    .snapshot-item-id {
      color: #999;
      margin-left: 4px;
    }
    .snapshot-back-btn {
      background: none;
      border: 1px solid #ccc;
      padding: 3px 10px;
      font-size: 11px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .snapshot-empty {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Job Vault</h1>
  <div id="list-view">
    <input id="search" type="search" placeholder="Filter jobs...">
    <ul id="job-list"></ul>
    <div id="status">Loading jobs...</div>
    <button id="save">Save Job</button>
  </div>
  <div id="detail-view">
    <button id="back-btn">&larr; Back</button>
    <div id="detail-content"></div>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
